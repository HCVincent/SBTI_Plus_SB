<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    :root {
      --bg: #f6faf6;
      --panel: #ffffff;
      --text: #1e2a22;
      --muted: #6a786f;
      --line: #dbe8dd;
      --soft: #edf6ef;
      --accent: #6c8d71;
      --accent-strong: #4d6a53;
      --shadow: 0 16px 40px rgba(47, 73, 55, 0.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, #f8fff8 0, #f6faf6 36%, #f2f7f3 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px 56px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 28px;
      margin-top: 20px;
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -60px;
      top: -60px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(127, 165, 134, 0.18), rgba(127, 165, 134, 0.02));
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--accent-strong);
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 999px;
      padding: 8px 12px;
      margin-bottom: 16px;
    }

    h1, h2, h3, p { margin: 0; }
    .hero h1 {
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1.08;
      letter-spacing: -0.03em;
      max-width: 680px;
    }
    .hero .sub {
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
      max-width: 720px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      gap: 18px;
      align-items: stretch;
      margin-top: 24px;
    }

    .mini-panel {
      padding: 18px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #fbfefb, #f3f8f4);
    }

    .mini-panel h3 {
      font-size: 15px;
      margin-bottom: 10px;
    }

    .mini-panel ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

        .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }
    .hero-minimal {
      min-height: 48vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 42px 20px;
    }
    .hero-minimal::after { display: none; }
    .hero-minimal h1 {
      max-width: none;
      margin: 0;
    }
    .hero-actions-single {
      justify-content: center;
      margin-top: 28px;
    }

    button {
      border: 0;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
      font: inherit;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: 0.55; transform: none; }

    .btn-primary {
      background: var(--accent-strong);
      color: #fff;
      padding: 14px 20px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(77, 106, 83, 0.18);
      font-weight: 700;
    }

    .btn-secondary {
      background: #fff;
      color: var(--accent-strong);
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid var(--line);
      font-weight: 700;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .test-wrap,
    .browse-wrap,
    .result-wrap {
      margin-top: 22px;
      padding: 22px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .progress {
      flex: 1;
      min-width: 240px;
      height: 10px;
      background: #edf3ee;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #97b59c, #5b7a62);
      border-radius: inherit;
      transition: width .22s ease;
    }

    .progress-text {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .question-list {
      display: grid;
      gap: 16px;
    }

    .question {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, #ffffff, #fbfdfb);
    }

    .question-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .question-title {
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .options {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }

    .option:hover {
      border-color: #bcd0c1;
      background: #f8fcf9;
    }

    .option input {
      margin-top: 3px;
      accent-color: var(--accent-strong);
      transform: scale(1.1);
      flex-shrink: 0;
    }

    .option-code {
      font-weight: 800;
      color: var(--accent-strong);
      min-width: 22px;
    }

    .actions-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
      padding-top: 6px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .browse-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .browse-header h2 {
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .browse-sub {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      max-width: 720px;
    }

    .catalog-section {
      margin-top: 24px;
    }

    .catalog-section h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .catalog-section p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    .catalog-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      background: linear-gradient(180deg, #ffffff, #fbfdfb);
      display: grid;
      gap: 12px;
      min-height: 220px;
    }

    .catalog-code {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-strong);
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .catalog-name {
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .catalog-intro {
      color: #304034;
      font-size: 14px;
      line-height: 1.8;
    }

    .catalog-foot {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
      margin-top: auto;
    }

    .catalog-foot span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .is-hidden {
      display: none !important;
    }

    .result-hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
      align-items: stretch;
    }

    .type-box,
    .score-box,
    .dim-box,
    .top3-box,
    .about-box {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, #ffffff, #fbfdfb);
    }

    .type-kicker {
      font-size: 12px;
      color: var(--accent-strong);
      margin-bottom: 8px;
      letter-spacing: .05em;
    }

    .type-name {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .type-subname {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .match {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--accent-strong);
      font-weight: 700;
    }

    .type-desc {
      margin-top: 18px;
      line-height: 1.85;
      font-size: 15px;
      color: #304034;
    }

    .score-box h3,
    .dim-box h3,
    .top3-box h3,
    .about-box h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .score-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
    }

    .score-item .k {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .score-item .v {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-strong);
    }

    .dim-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .dim-pill {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
    }

    .dim-pill .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .dim-pill .value {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-strong);
    }

    .top3-list {
      display: grid;
      gap: 10px;
    }

    .top3-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .top3-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .top3-item span {
      color: var(--muted);
      font-size: 13px;
    }

    .top3-score {
      color: var(--accent-strong);
      font-weight: 800;
      white-space: nowrap;
    }

    .about-box p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .footer-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    
    .result-layout {
      display: grid;
      gap: 18px;
    }
    .result-top {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 18px;
      align-items: stretch;
    }
    .poster-box, .type-box, .analysis-box, .dim-box, .note-box {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, #ffffff, #fbfdfb);
    }
        .poster-box {
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 280px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at top right, rgba(127,165,134,0.16), rgba(127,165,134,0) 40%),
        linear-gradient(180deg, #ffffff, #f7fbf8);
    }
    .poster-box::after {
      content: "";
      position: absolute;
      right: -46px;
      bottom: -46px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(127,165,134,0.12), rgba(127,165,134,0.01));
      pointer-events: none;
    }
    .poster-image {
      width: 100%;
      min-height: 220px;
      max-height: 460px;
      object-fit: contain;
      border-radius: 18px;
      background: rgba(255,255,255,0.75);
      position: relative;
      z-index: 1;
    }
    .poster-box.no-image .poster-image {
      display: none;
    }
    .poster-caption {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      position: relative;
      z-index: 1;
    }
    .type-kicker {
      font-size: 12px;
      color: var(--accent-strong);
      margin-bottom: 8px;
      letter-spacing: .06em;
    }
    .type-name {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }
    .type-subname {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }
    .match {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--accent-strong);
      font-weight: 700;
      font-size: 14px;
      line-height: 1.4;
    }
    .analysis-box h3, .dim-box h3, .note-box h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }
    .result-actions {
      margin-top: 22px;
      display: flex;
      justify-content: flex-end;
    }
    .analysis-box p {
      margin: 0;
      color: #304034;
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-wrap;
    }
    .dim-list {
      display: grid;
      gap: 12px;
    }
    .dim-item {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: #fff;
    }
    .dim-item-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .dim-item-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .dim-item-score {
      color: var(--accent-strong);
      font-weight: 800;
      font-size: 14px;
      white-space: nowrap;
    }
    .dim-item p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }
    .note-box p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .author-box {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff, #fbfdfb);
      overflow: hidden;
    }
    .author-box summary {
      list-style: none;
      cursor: pointer;
      padding: 18px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .author-box summary::-webkit-details-marker { display: none; }
    .author-box summary::after {
      content: var(--author-summary-expand);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-strong);
      border: 1px solid var(--line);
      background: var(--soft);
      padding: 6px 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .author-box[open] summary::after {
      content: var(--author-summary-collapse);
    }
    .author-content {
      border-top: 1px solid var(--line);
      padding: 0 18px 18px;
    }
    .author-content p {
      margin: 14px 0 0;
      color: #304034;
      font-size: 14px;
      line-height: 1.9;
    }

    .result-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    @media (max-width: 860px) {
      .result-top { grid-template-columns: 1fr; }
    }

@media (max-width: 860px) {
      .hero-grid,
      .result-hero,
      .catalog-grid {
        grid-template-columns: 1fr;
      }
      .dim-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 600px) {
      .shell { padding: 14px 12px 42px; }
      .hero, .test-wrap, .result-wrap { padding: 16px; }
      .hero h1 { font-size: 32px; }
      .question-title { font-size: 15px; }
      .dim-grid,
      .score-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section id="intro" class="screen active">
      <div class="hero card hero-minimal">
        <h1 id="introTitle"></h1>
        <div class="hero-actions hero-actions-single">
          <button id="startBtn" class="btn-primary"></button>
          <button id="browseBtn" class="btn-secondary"></button>
          <button id="randomBtn" class="btn-secondary"></button>
        </div>
        <div style="padding-top: 2rem; display: flex; flex-direction: column;">
          <span>
            <span id="introAuthorLabel"></span>
            <a id="introAuthorLink" href="https://space.bilibili.com/417038183"></a>
          </span>
          <span>
            <span id="introHostLabel"></span><span id="introHostValue"></span>
          </span>
          <span>
            <span id="introDomainLabel"></span><span id="introDomainValue"></span>
          </span>
        </div>
      </div>
    </section>

    <section id="browse" class="screen">
      <div class="browse-wrap card">
        <div class="browse-header">
          <div>
            <h2 id="browseTitle"></h2>
            <p id="browseSub" class="browse-sub"></p>
          </div>
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <button id="browseBackBtn" class="btn-secondary"></button>
            <button id="browseStartBtn" class="btn-primary"></button>
          </div>
        </div>

        <div class="catalog-section">
          <h3 id="browseMainTitle"></h3>
          <p id="browseMainSub"></p>
          <div id="browseMainGrid" class="catalog-grid"></div>
        </div>

        <div class="catalog-section">
          <h3 id="browseEasterTitle"></h3>
          <p id="browseEasterSub"></p>
          <div id="browseEasterGrid" class="catalog-grid"></div>
        </div>
      </div>
    </section>

    <section id="test" class="screen">
      <div class="test-wrap card">
        <div class="topbar">
          <div class="progress"><span id="progressBar"></span></div>
          <div class="progress-text" id="progressText"></div>
        </div>

        <div id="questionList" class="question-list"></div>

        <div class="actions-bottom">
          <div class="hint" id="testHint"></div>
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <button id="backIntroBtn" class="btn-secondary"></button>
            <button id="submitBtn" class="btn-primary" disabled></button>
          </div>
        </div>
      </div>
    </section>

    
    <section id="result" class="screen">
      <div class="result-wrap card">
        <div class="result-layout">
          <div class="result-top">
            <div class="poster-box" id="posterBox">
              <img id="posterImage" class="poster-image" alt="" />
              <div id="posterCaption" class="poster-caption"></div>
            </div>

            <div class="type-box">
              <div class="type-kicker" id="resultModeKicker"></div>
              <div class="type-name" id="resultTypeName"></div>
              <div class="match" id="matchBadge"></div>
              <div class="type-subname" id="resultTypeSub"></div>
            </div>
          </div>

          <div class="analysis-box" id="analysisBox">
            <h3 id="analysisTitle"></h3>
            <p id="resultDesc"></p>
          </div>

          <div class="dim-box" id="dimBox">
            <h3 id="dimTitle"></h3>
            <div id="dimList" class="dim-list"></div>
          </div>

          <div class="note-box" id="noteBox">
            <h3 id="noteTitle"></h3>
            <p id="funNote"></p>
          </div>

                    <details class="author-box">
            <summary id="authorSummary"></summary>
            <div class="author-content" id="authorContent"></div>
          </details>
        </div>

        <div class="result-actions">
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <button id="restartBtn" class="btn-secondary"></button>
            <button id="resultBrowseBtn" class="btn-secondary"></button>
            <button id="toTopBtn" class="btn-primary"></button>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="./data/sbti-texts.js"></script>
  <script>
    const texts = window.SBTI_TEXTS;
    if (!texts) {
      throw new Error('Missing window.SBTI_TEXTS from data/sbti-texts.js');
    }
    const uiText = texts.ui;
    const dimensionMeta = texts.dimensionMeta;
    const questions = texts.questions;
    const specialQuestions = texts.specialQuestions;
    const TYPE_LIBRARY = texts.typeLibrary;
    const TYPE_IMAGES = {

    const NORMAL_TYPES = [
  {
    "code": "CTRL",
    "pattern": "HHH-HMH-MHH-HHH-MHM"
  },
  {
    "code": "ATM-er",

  {

    "pattern": "MHM-MMH-MHM-HMH-LHL"
  },
  {

    "pattern": "HHH-HMH-MMH-HHH-LHL"
  },
  {
    "code": "THAN-K",
    "pattern": "MHM-HMM-HHM-MMH-MHL"
  },
  {
    "code": "OH-NO",
    "pattern": "HHL-LMH-LHH-HHM-LHL"
  },
  {

  },
  {

    "pattern": "MMH-MMM-HML-LMM-MML"

  {

    "pattern": "MLH-MHM-MLH-MLH-LMH"
  },
  {
    "code": "JOKE-R",
    "pattern": "LLH-LHL-LML-LLL-MLM"
  },
  {
    "code": "WOC!",
    "pattern": "HHL-HMH-MMH-HHM-LHH"
  },
  {
    "code": "THIN-K",
    "pattern": "HHL-HMH-MLH-MHM-LHH"
  },
  {
    "code": "SHIT",
    "pattern": "HHL-HLH-LMM-HHM-LHH"
  },
  {
    "code": "ZZZZ",
    "pattern": "MHL-MLH-LML-MML-LHM"
  },
  {
    "code": "POOR",
    "pattern": "HHL-MLH-LMH-HHH-LHL"
  },
  {
    "code": "MONK",
    "pattern": "HHL-LLH-LLM-MML-LHM"
  },
  {

  },
  {
    "code": "SOLO",
    "pattern": "LML-LLH-LHL-LML-LHM"
  },
  {
    "code": "FUCK",
    "pattern": "MLL-LHL-LLM-MLL-HLH"
  },
  {
    "code": "DEAD",
    "pattern": "LLL-LLM-LML-LLL-LHM"
  },
  {
    "code": "IMFW",
    "pattern": "LLH-LHL-LML-LLL-MLL"
  }
];
    const EASTER_EGG_TYPES = ['HHHH', 'DRUNK'];
    const DIM_EXPLANATIONS = texts.dimExplanations;
    const dimensionOrder = ['S1','S2','S3','E1','E2','E3','A1','A2','A3','Ac1','Ac2','Ac3','So1','So2','So3'];

    const DRUNK_TRIGGER_QUESTION_ID = 'drink_gate_q2';

    const app = {
      shuffledQuestions: [],
      answers: {},
      previewMode: false,
      resultViewMode: 'test'
    };

    const screens = {
      intro: document.getElementById('intro'),
      browse: document.getElementById('browse'),
      test: document.getElementById('test'),
      result: document.getElementById('result')
    };

    const questionList = document.getElementById('questionList');
    const browseMainGrid = document.getElementById('browseMainGrid');
    const browseEasterGrid = document.getElementById('browseEasterGrid');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const submitBtn = document.getElementById('submitBtn');
    const restartBtn = document.getElementById('restartBtn');
    const resultBrowseBtn = document.getElementById('resultBrowseBtn');
    const testHint = document.getElementById('testHint');
    const posterImage = document.getElementById('posterImage');
    const posterCaption = document.getElementById('posterCaption');
    const resultModeKicker = document.getElementById('resultModeKicker');
    const resultTypeName = document.getElementById('resultTypeName');
    const matchBadge = document.getElementById('matchBadge');
    const resultTypeSub = document.getElementById('resultTypeSub');
    const resultDesc = document.getElementById('resultDesc');
    const funNote = document.getElementById('funNote');
    const dimBox = document.getElementById('dimBox');
    const authorContent = document.getElementById('authorContent');

    function formatText(template, values) {
      return template.replace(/\{(\w+)\}/g, (_, key) => String(values[key] ?? ''));
    }

    function applyStaticTexts() {
      document.title = uiText.pageTitle;
      document.getElementById('introTitle').textContent = uiText.introTitle;
      document.getElementById('startBtn').textContent = uiText.buttons.start;
      document.getElementById('browseBtn').textContent = uiText.buttons.browseAll;
      document.getElementById('randomBtn').textContent = uiText.buttons.randomResult;
      document.getElementById('backIntroBtn').textContent = uiText.buttons.backIntro;
      document.getElementById('submitBtn').textContent = uiText.buttons.submit;
      restartBtn.textContent = uiText.buttons.restart;
      resultBrowseBtn.textContent = uiText.buttons.browseAll;
      document.getElementById('toTopBtn').textContent = uiText.buttons.toTop;
      document.getElementById('browseBackBtn').textContent = uiText.buttons.backIntro;
      document.getElementById('browseStartBtn').textContent = uiText.buttons.start;

      document.getElementById('browseTitle').textContent = uiText.browse.title;
      document.getElementById('browseSub').textContent = uiText.browse.sub;
      document.getElementById('browseMainTitle').textContent = uiText.browse.mainTitle;
      document.getElementById('browseMainSub').textContent = uiText.browse.mainSub;
      document.getElementById('browseEasterTitle').textContent = uiText.browse.easterTitle;
      document.getElementById('browseEasterSub').textContent = uiText.browse.easterSub;

      document.getElementById('introAuthorLabel').textContent = uiText.introMeta.authorLabel;
      document.getElementById('introAuthorLink').textContent = uiText.introMeta.authorLinkText;
      document.getElementById('introHostLabel').textContent = uiText.introMeta.hostLabel;
      document.getElementById('introHostValue').textContent = uiText.introMeta.hostValue;
      document.getElementById('introDomainLabel').textContent = uiText.introMeta.domainLabel;
      document.getElementById('introDomainValue').textContent = uiText.introMeta.domainValue;

      progressText.textContent = uiText.progress.initial;
      testHint.textContent = uiText.progress.incompleteHint;

      posterImage.alt = uiText.result.posterAlt;
      posterCaption.textContent = uiText.result.posterCaptionDefault;
      resultModeKicker.textContent = uiText.result.modeKickerDefault;
      resultTypeName.textContent = uiText.result.typeNameDefault;
      matchBadge.textContent = uiText.result.matchBadgeDefault;
      resultTypeSub.textContent = uiText.result.typeSubDefault;
      document.getElementById('analysisTitle').textContent = uiText.result.analysisTitle;
      document.getElementById('dimTitle').textContent = uiText.result.dimTitle;
      document.getElementById('noteTitle').textContent = uiText.result.noteTitle;
      funNote.textContent = uiText.result.noteDefault;
      document.getElementById('authorSummary').textContent = uiText.result.authorSummary;
      document.documentElement.style.setProperty('--author-summary-expand', `"${uiText.result.authorExpand}"`);
      document.documentElement.style.setProperty('--author-summary-collapse', `"${uiText.result.authorCollapse}"`);
      authorContent.innerHTML = uiText.result.authorParagraphs.map(text => `<p>${text}</p>`).join('');
    }

    function showScreen(name) {
      Object.entries(screens).forEach(([key, el]) => {
        el.classList.toggle('active', key === name);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getVisibleQuestions() {
      const visible = [...app.shuffledQuestions];
      const gateIndex = visible.findIndex(q => q.id === 'drink_gate_q1');
      if (gateIndex !== -1 && app.answers['drink_gate_q1'] === 3) {
        visible.splice(gateIndex + 1, 0, specialQuestions[1]);
      }
      return visible;
    }

    function getQuestionMetaLabel(q) {
      if (q.special) return uiText.question.specialMeta;
      return app.previewMode ? dimensionMeta[q.dim].name : uiText.question.hiddenMeta;
    }

    function renderCatalogGrid(container, codes) {
      container.innerHTML = codes.map((code) => {
        const type = TYPE_LIBRARY[code];
        return `
          <article class="catalog-card">
            <div class="catalog-code">${type.code}</div>
            <div class="catalog-name">${type.cn}</div>
            <div class="catalog-intro">${type.intro}</div>
            <div class="catalog-foot">
              <button class="btn-secondary" data-type-code="${type.code}">${uiText.browse.cardAction}</button>
            </div>
          </article>
        `;
      }).join('');

      container.querySelectorAll('[data-type-code]').forEach((button) => {
        button.addEventListener('click', () => {
          openTypeDetail(button.dataset.typeCode);
        });
      });
    }

    function renderBrowseCatalog() {
      renderCatalogGrid(browseMainGrid, NORMAL_TYPES.map(type => type.code));
      renderCatalogGrid(browseEasterGrid, EASTER_EGG_TYPES);
    }

    function renderQuestions() {
      const visibleQuestions = getVisibleQuestions();
      questionList.innerHTML = '';
      visibleQuestions.forEach((q, index) => {
        const card = document.createElement('article');
        card.className = 'question';
        card.innerHTML = `
          <div class="question-meta">
            <div class="badge">${formatText(uiText.question.numberTemplate, { index: index + 1 })}</div>
            <div>${getQuestionMetaLabel(q)}</div>
          </div>
          <div class="question-title">${q.text}</div>
          <div class="options">
            ${q.options.map((opt, i) => {
              const code = ['A', 'B', 'C', 'D'][i] || String(i + 1);
              const checked = app.answers[q.id] === opt.value ? 'checked' : '';
              return `
                <label class="option">
                  <input type="radio" name="${q.id}" value="${opt.value}" ${checked} />
                  <div class="option-code">${code}</div>
                  <div>${opt.label}</div>
                </label>
              `;
            }).join('')}
          </div>
        `;
        questionList.appendChild(card);
      });

      questionList.querySelectorAll('input[type="radio"]').forEach(input => {
        input.addEventListener('change', (e) => {
          const { name, value } = e.target;
          app.answers[name] = Number(value);

          if (name === 'drink_gate_q1') {
            if (Number(value) !== 3) {
              delete app.answers['drink_gate_q2'];
            }
            renderQuestions();
            return;
          }

          updateProgress();
        });
      });

      updateProgress();
    }

    function updateProgress() {
      const visibleQuestions = getVisibleQuestions();
      const total = visibleQuestions.length;
      const done = visibleQuestions.filter(q => app.answers[q.id] !== undefined).length;
      const percent = total ? (done / total) * 100 : 0;
      progressBar.style.width = `${percent}%`;
      progressText.textContent = formatText(uiText.templates.progress, { done, total });
      const complete = done === total && total > 0;
      submitBtn.disabled = !complete;
      testHint.textContent = complete
        ? uiText.progress.completeHint
        : uiText.progress.incompleteHint;
    }

    function sumToLevel(score) {
      if (score <= 3) return 'L';
      if (score === 4) return 'M';
      return 'H';
    }

    function levelNum(level) {
      return { L: 1, M: 2, H: 3 }[level];
    }

    function parsePattern(pattern) {
      return pattern.replace(/-/g, '').split('');
    }

    function getDrunkTriggered() {
      return app.answers[DRUNK_TRIGGER_QUESTION_ID] === 2;
    }

    function computeResult() {
      const rawScores = {};
      const levels = {};
      Object.keys(dimensionMeta).forEach(dim => { rawScores[dim] = 0; });

      questions.forEach(q => {
        rawScores[q.dim] += Number(app.answers[q.id] || 0);
      });

      Object.entries(rawScores).forEach(([dim, score]) => {
        levels[dim] = sumToLevel(score);
      });

      const userVector = dimensionOrder.map(dim => levelNum(levels[dim]));
      const ranked = NORMAL_TYPES.map(type => {
        const vector = parsePattern(type.pattern).map(levelNum);
        let distance = 0;
        let exact = 0;
        for (let i = 0; i < vector.length; i++) {
          const diff = Math.abs(userVector[i] - vector[i]);
          distance += diff;
          if (diff === 0) exact += 1;
        }
        const similarity = Math.max(0, Math.round((1 - distance / 30) * 100));
        return { ...type, ...TYPE_LIBRARY[type.code], distance, exact, similarity };
      }).sort((a, b) => {
        if (a.distance !== b.distance) return a.distance - b.distance;
        if (b.exact !== a.exact) return b.exact - a.exact;
        return b.similarity - a.similarity;
      });

      const bestNormal = ranked[0];
      const drunkTriggered = getDrunkTriggered();

      let finalType;
      let modeKicker = uiText.resultStates.normal.modeKicker;
      let badge = formatText(uiText.templates.badgeNormal, {
        similarity: bestNormal.similarity,
        exact: bestNormal.exact
      });
      let sub = uiText.resultStates.normal.sub;
      let special = false;
      let secondaryType = null;

      if (drunkTriggered) {
        finalType = TYPE_LIBRARY.DRUNK;
        secondaryType = bestNormal;
        modeKicker = uiText.resultStates.drunk.modeKicker;
        badge = uiText.resultStates.drunk.badge;
        sub = uiText.resultStates.drunk.sub;
        special = true;
      } else if (bestNormal.similarity < 60) {
        finalType = TYPE_LIBRARY.HHHH;
        modeKicker = uiText.resultStates.fallback.modeKicker;
        badge = formatText(uiText.templates.badgeFallback, { similarity: bestNormal.similarity });
        sub = uiText.resultStates.fallback.sub;
        special = true;
      } else {
        finalType = bestNormal;
      }

      return {
        rawScores,
        levels,
        ranked,
        bestNormal,
        finalType,
        modeKicker,
        badge,
        sub,
        special,
        secondaryType
      };
    }

    function renderDimList(result) {
      const dimList = document.getElementById('dimList');
      dimList.innerHTML = dimensionOrder.map(dim => {
        const level = result.levels[dim];
        const explanation = DIM_EXPLANATIONS[dim][level];
        return `
          <div class="dim-item">
            <div class="dim-item-top">
              <div class="dim-item-name">${dimensionMeta[dim].name}</div>
              <div class="dim-item-score">${formatText(uiText.templates.dimScore, { level, score: result.rawScores[dim] })}</div>
            </div>
            <p>${explanation}</p>
          </div>
        `;
      }).join('');
    }

    function setResultMode(mode) {
      app.resultViewMode = mode;
      restartBtn.textContent = mode === 'browse'
        ? uiText.buttons.start
        : uiText.buttons.restart;
      resultBrowseBtn.textContent = mode === 'browse'
        ? uiText.buttons.backBrowse
        : uiText.buttons.browseAll;
    }

    function renderTypeDetail({ type, modeKicker, badge, sub, note, showMatch, showDims, result, mode }) {
      setResultMode(mode);

      resultModeKicker.textContent = modeKicker;
      resultTypeName.textContent = formatText(uiText.templates.typeName, { code: type.code, cn: type.cn });
      matchBadge.textContent = badge || '';
      resultTypeSub.textContent = sub;
      resultDesc.textContent = type.desc;
      posterCaption.textContent = type.intro;
      funNote.textContent = note;
      matchBadge.classList.toggle('is-hidden', !showMatch);
      dimBox.classList.toggle('is-hidden', !showDims);

      const posterBox = document.getElementById('posterBox');
      const imageSrc = TYPE_IMAGES[type.code];
      if (imageSrc) {
        posterImage.src = imageSrc;
        posterImage.alt = formatText(uiText.templates.typeName, { code: type.code, cn: type.cn });
        posterBox.classList.remove('no-image');
      } else {
        posterImage.removeAttribute('src');
        posterImage.alt = uiText.result.posterAlt;
        posterBox.classList.add('no-image');
      }

      if (showDims && result) {
        renderDimList(result);
      } else {
        document.getElementById('dimList').innerHTML = '';
      }
      showScreen('result');
    }

    function renderResult(source = 'test') {
      const result = computeResult();
      const type = result.finalType;
      const isRandom = source === 'random';

      const modeKicker = isRandom
        ? formatText(uiText.resultStates.random.modeKickerTemplate, { mode: result.modeKicker })
        : result.modeKicker;
      const sub = isRandom
        ? formatText(uiText.resultStates.random.subTemplate, { base: result.sub })
        : result.sub;
      const note = isRandom
        ? uiText.notes.random
        : (result.special ? uiText.notes.special : uiText.notes.normal);

      renderTypeDetail({
        type,
        modeKicker,
        badge: result.badge,
        sub,
        note,
        showMatch: true,
        showDims: true,
        result,
        mode: isRandom ? 'random' : 'test'
      });
    }

    function openTypeDetail(code) {
      const type = TYPE_LIBRARY[code];
      if (!type) return;
      renderTypeDetail({
        type,
        modeKicker: uiText.browse.detailKicker,
        badge: '',
        sub: uiText.browse.detailSub,
        note: uiText.browse.detailNote,
        showMatch: false,
        showDims: false,
        result: null,
        mode: 'browse'
      });
    }

    function getRandomOptionValue(question) {
      const options = question.options || [];
      const picked = options[Math.floor(Math.random() * options.length)];
      return picked ? picked.value : undefined;
    }

    function generateRandomAnswers() {
      const answers = {};
      questions.forEach((question) => {
        answers[question.id] = getRandomOptionValue(question);
      });

      const gateQuestion = specialQuestions[0];
      answers[gateQuestion.id] = getRandomOptionValue(gateQuestion);

      if (answers[gateQuestion.id] === 3) {
        answers[specialQuestions[1].id] = getRandomOptionValue(specialQuestions[1]);
      }

      return answers;
    }

    function startRandomResult() {
      app.previewMode = false;
      app.shuffledQuestions = [];
      app.answers = generateRandomAnswers();
      renderResult('random');
    }

    function startTest(preview = false) {
      app.previewMode = preview;
      app.answers = {};
      const shuffledRegular = shuffle(questions);
      const insertIndex = Math.floor(Math.random() * shuffledRegular.length) + 1;
      app.shuffledQuestions = [
        ...shuffledRegular.slice(0, insertIndex),
        specialQuestions[0],
        ...shuffledRegular.slice(insertIndex)
      ];
      renderQuestions();
      showScreen('test');
    }

    applyStaticTexts();
    renderBrowseCatalog();
    document.getElementById('startBtn').addEventListener('click', () => startTest(false));
    document.getElementById('browseBtn').addEventListener('click', () => {
      renderBrowseCatalog();
      showScreen('browse');
    });
    document.getElementById('randomBtn').addEventListener('click', startRandomResult);
    document.getElementById('browseBackBtn').addEventListener('click', () => showScreen('intro'));
    document.getElementById('browseStartBtn').addEventListener('click', () => startTest(false));
    document.getElementById('backIntroBtn').addEventListener('click', () => showScreen('intro'));
    document.getElementById('submitBtn').addEventListener('click', () => renderResult('test'));
    document.getElementById('restartBtn').addEventListener('click', () => startTest(false));
    document.getElementById('resultBrowseBtn').addEventListener('click', () => {
      renderBrowseCatalog();
      showScreen('browse');
    });
    document.getElementById('toTopBtn').addEventListener('click', () => showScreen('intro'));
  </script>
