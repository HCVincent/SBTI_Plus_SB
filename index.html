<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    :root {
      --bg: #f6faf6;
      --panel: #ffffff;
      --text: #1e2a22;
      --muted: #6a786f;
      --line: #dbe8dd;
      --soft: #edf6ef;
      --accent: #6c8d71;
      --accent-strong: #4d6a53;
      --shadow: 0 16px 40px rgba(47, 73, 55, 0.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, #f8fff8 0, #f6faf6 36%, #f2f7f3 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 16px 56px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 28px;
      margin-top: 20px;
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -60px;
      top: -60px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(127, 165, 134, 0.18), rgba(127, 165, 134, 0.02));
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--accent-strong);
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 999px;
      padding: 8px 12px;
      margin-bottom: 16px;
    }

    h1, h2, h3, p { margin: 0; }
    .hero h1 {
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1.08;
      letter-spacing: -0.03em;
      max-width: 680px;
    }
    .hero .sub {
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
      max-width: 720px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      gap: 18px;
      align-items: stretch;
      margin-top: 24px;
    }

    .mini-panel {
      padding: 18px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #fbfefb, #f3f8f4);
    }

    .mini-panel h3 {
      font-size: 15px;
      margin-bottom: 10px;
    }

    .mini-panel ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

        .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }
    .hero-minimal {
      min-height: 48vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 42px 20px;
    }
    .hero-minimal::after { display: none; }
    .hero-minimal h1 {
      max-width: none;
      margin: 0;
    }
    .hero-actions-single {
      justify-content: center;
      margin-top: 28px;
    }

    button {
      border: 0;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
      font: inherit;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: 0.55; transform: none; }

    .btn-primary {
      background: var(--accent-strong);
      color: #fff;
      padding: 14px 20px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(77, 106, 83, 0.18);
      font-weight: 700;
    }

    .btn-secondary {
      background: #fff;
      color: var(--accent-strong);
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid var(--line);
      font-weight: 700;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .test-wrap,
    .browse-wrap,
    .result-wrap {
      margin-top: 22px;
      padding: 22px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .progress {
      flex: 1;
      min-width: 240px;
      height: 10px;
      background: #edf3ee;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #97b59c, #5b7a62);
      border-radius: inherit;
      transition: width .22s ease;
    }

    .progress-text {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .question-list {
      display: grid;
      gap: 16px;
    }

    .question {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, #ffffff, #fbfdfb);
    }

    .question-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .question-title {
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .options {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }

    .option:hover {
      border-color: #bcd0c1;
      background: #f8fcf9;
    }

    .option input {
      margin-top: 3px;
      accent-color: var(--accent-strong);
      transform: scale(1.1);
      flex-shrink: 0;
    }

    .option-code {
      font-weight: 800;
      color: var(--accent-strong);
      min-width: 22px;
    }

    .actions-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
      padding-top: 6px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .browse-wrap {
      padding: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #ffffff, #fbfdfb);
    }

    .browse-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      padding: 34px 34px 18px;
    }

    .browse-header h2 {
      font-size: clamp(34px, 4.8vw, 58px);
      line-height: 0.98;
      letter-spacing: -0.05em;
      max-width: 9ch;
    }

    .browse-sub {
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.85;
      max-width: 760px;
    }

    .browse-overview {
      padding: 0 34px 28px;
      max-width: 860px;
    }

    .browse-overview-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--accent-strong);
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .browse-overview p {
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.85;
    }

    .catalog-bands {
      display: grid;
    }

    .catalog-band {
      position: relative;
      overflow: hidden;
      padding: 56px 34px 42px;
      min-height: 420px;
      isolation: isolate;
    }

    .catalog-band + .catalog-band {
      border-top: 1px solid rgba(48, 64, 52, 0.08);
    }

    .catalog-band-watermark {
      position: absolute;
      left: 30px;
      top: 18px;
      font-size: clamp(72px, 14vw, 180px);
      line-height: 0.82;
      letter-spacing: -0.08em;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.72);
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    .catalog-band-head,
    .catalog-band-grid {
      position: relative;
      z-index: 1;
    }

    .catalog-band-head {
      max-width: 480px;
    }

    .catalog-band-kicker {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(48, 64, 52, 0.1);
      color: rgba(36, 48, 40, 0.78);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      backdrop-filter: blur(12px);
    }

    .catalog-band-head h3 {
      margin-top: 14px;
      font-size: clamp(34px, 4.5vw, 62px);
      line-height: 0.94;
      letter-spacing: -0.05em;
    }

    .catalog-band-head p {
      margin-top: 14px;
      color: rgba(34, 47, 39, 0.8);
      font-size: 15px;
      line-height: 1.85;
      max-width: 34ch;
    }

    .catalog-band-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
      align-items: end;
      margin-top: 30px;
    }

    .catalog-band--plum {
      background: linear-gradient(180deg, #eadff0 0%, #e4d8ed 100%);
    }

    .catalog-band--mint {
      background: linear-gradient(180deg, #daf0ea 0%, #d2ebe3 100%);
    }

    .catalog-band--peach {
      background: linear-gradient(180deg, #f5e4d7 0%, #f0dccf 100%);
    }

    .catalog-band--sky {
      background: linear-gradient(180deg, #dcecf6 0%, #d4e7f2 100%);
    }

    .catalog-band--sage {
      background: linear-gradient(180deg, #e7eedf 0%, #dde8d4 100%);
    }

    .band-type {
      display: grid;
      gap: 10px;
      align-content: start;
      justify-items: center;
      text-align: center;
      padding: 16px 12px 20px;
      border-radius: 24px;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
      min-height: 100%;
    }

    .band-type:hover {
      transform: translateY(-6px);
      background: rgba(255, 255, 255, 0.24);
      box-shadow: 0 16px 36px rgba(48, 64, 52, 0.12);
    }

    .band-figure {
      width: min(180px, 100%);
      min-height: 214px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      border-radius: 26px;
    }

    .band-figure img {
      width: 124%;
      height: 100%;
      max-height: none;
      object-fit: cover;
      object-position: center 78%;
      transform: translateY(12px);
      mix-blend-mode: multiply;
      filter: drop-shadow(0 14px 24px rgba(48, 64, 52, 0.18));
    }

    .band-name {
      font-size: 28px;
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    .band-code {
      color: rgba(34, 47, 39, 0.72);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .band-intro {
      max-width: 18ch;
      color: rgba(34, 47, 39, 0.74);
      font-size: 13px;
      line-height: 1.75;
    }

    .catalog-easter-shell {
      padding: 34px;
      background: linear-gradient(180deg, #243128 0%, #2e3c31 100%);
      color: #f4f8f4;
    }

    .catalog-easter-head {
      max-width: 640px;
      position: relative;
    }

    .catalog-easter-watermark {
      position: absolute;
      right: -10px;
      top: -18px;
      font-size: clamp(54px, 12vw, 128px);
      line-height: 0.82;
      letter-spacing: -0.08em;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.08);
      pointer-events: none;
      user-select: none;
    }

    .catalog-easter-head h3 {
      font-size: clamp(30px, 4vw, 44px);
      line-height: 0.98;
      letter-spacing: -0.04em;
      position: relative;
      z-index: 1;
    }

    .catalog-easter-head p {
      margin-top: 14px;
      color: rgba(244, 248, 244, 0.76);
      font-size: 15px;
      line-height: 1.85;
      position: relative;
      z-index: 1;
    }

    .catalog-easter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 24px;
    }

    .catalog-easter-card {
      display: grid;
      grid-template-columns: minmax(120px, 170px) 1fr;
      gap: 18px;
      align-items: center;
      padding: 20px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .catalog-easter-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.18);
      background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.07));
    }

    .catalog-easter-figure {
      min-height: 180px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      border-radius: 22px;
    }

    .catalog-easter-figure img {
      width: 128%;
      height: 100%;
      max-height: none;
      object-fit: cover;
      object-position: center 78%;
      transform: translateY(10px);
      mix-blend-mode: multiply;
      filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.26));
    }

    .catalog-easter-copy h4 {
      font-size: clamp(28px, 4vw, 40px);
      line-height: 0.96;
      letter-spacing: -0.05em;
    }

    .catalog-easter-code {
      display: inline-flex;
      margin-bottom: 10px;
      color: rgba(244, 248, 244, 0.72);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .catalog-easter-copy p {
      margin-top: 12px;
      color: rgba(244, 248, 244, 0.78);
      font-size: 14px;
      line-height: 1.8;
      max-width: 28ch;
    }

    .is-hidden {
      display: none !important;
    }

    .result-hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
      align-items: stretch;
    }

    .type-box,
    .score-box,
    .dim-box,
    .top3-box,
    .about-box {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, #ffffff, #fbfdfb);
    }

    .type-kicker {
      font-size: 12px;
      color: var(--accent-strong);
      margin-bottom: 8px;
      letter-spacing: .05em;
    }

    .type-name {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .type-subname {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .match {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--accent-strong);
      font-weight: 700;
    }

    .type-desc {
      margin-top: 18px;
      line-height: 1.85;
      font-size: 15px;
      color: #304034;
    }

    .score-box h3,
    .dim-box h3,
    .top3-box h3,
    .about-box h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .score-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
    }

    .score-item .k {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .score-item .v {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-strong);
    }

    .dim-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .dim-pill {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
    }

    .dim-pill .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .dim-pill .value {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-strong);
    }

    .top3-list {
      display: grid;
      gap: 10px;
    }

    .top3-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .top3-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .top3-item span {
      color: var(--muted);
      font-size: 13px;
    }

    .top3-score {
      color: var(--accent-strong);
      font-weight: 800;
      white-space: nowrap;
    }

    .about-box p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .footer-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    
    .result-layout {
      display: grid;
      gap: 24px;
      grid-template-columns: minmax(0, 1fr);
      width: 100%;
    }
    .result-layout > * {
      min-width: 0;
      justify-self: stretch;
    }
    #section-intro {
      display: grid;
      gap: 18px;
      min-width: 0;
    }
    .result-top {
      display: grid;
      grid-template-columns: minmax(300px, 0.86fr) minmax(0, 1.14fr);
      gap: 24px;
      align-items: stretch;
    }
    .poster-box, .type-box, .analysis-box, .dim-box, .note-box {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, #ffffff, #fbfdfb);
    }
        .poster-box {
      display: grid;
      grid-template-rows: minmax(260px, 1fr) auto;
      min-height: 420px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at top right, rgba(127,165,134,0.16), rgba(127,165,134,0) 40%),
        linear-gradient(180deg, #ffffff, #f7fbf8);
    }
    .poster-box::after {
      content: "";
      position: absolute;
      right: -46px;
      bottom: -46px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(127,165,134,0.12), rgba(127,165,134,0.01));
      pointer-events: none;
    }
    .poster-image {
      width: 100%;
      min-height: 280px;
      max-height: 520px;
      height: 100%;
      object-fit: contain;
      border-radius: 18px;
      background: rgba(255,255,255,0.75);
      position: relative;
      z-index: 1;
    }
    .poster-box.no-image .poster-image {
      display: none;
    }
    .poster-caption {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      position: relative;
      z-index: 1;
    }
    .type-kicker {
      font-size: 12px;
      color: var(--accent-strong);
      margin-bottom: 8px;
      letter-spacing: .06em;
    }
    .type-name {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }
    .type-subname {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }
    .type-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 420px;
    }
    .match {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--accent-strong);
      font-weight: 700;
      font-size: 14px;
      line-height: 1.4;
    }
    .analysis-box h3, .dim-box h3, .note-box h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }
    .result-actions {
      margin-top: 22px;
      display: flex;
      justify-content: flex-end;
    }
    .analysis-box p {
      margin: 0;
      color: #304034;
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-wrap;
    }
    .dim-list {
      display: grid;
      gap: 12px;
    }
    .dim-item {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: #fff;
    }
    .dim-item-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;

      document.getElementById('introHostLabel').textContent = uiText.introMeta.hostLabel;
      document.getElementById('introHostValue').textContent = uiText.introMeta.hostValue;
      document.getElementById('introDomainLabel').textContent = uiText.introMeta.domainLabel;
      document.getElementById('introDomainValue').textContent = uiText.introMeta.domainValue;

      progressText.textContent = uiText.progress.initial;
      testHint.textContent = uiText.progress.incompleteHint;

      posterImage.alt = uiText.result.posterAlt;
      posterCaption.textContent = uiText.result.posterCaptionDefault;
      resultModeKicker.textContent = uiText.result.modeKickerDefault;
      resultTypeName.textContent = uiText.result.typeNameDefault;
      matchBadge.textContent = uiText.result.matchBadgeDefault;
      resultTypeSub.textContent = uiText.result.typeSubDefault;
      document.getElementById('analysisTitle').textContent = uiText.result.analysisTitle;
      document.getElementById('dimTitle').textContent = uiText.result.dimTitle;
      document.getElementById('noteTitle').textContent = uiText.result.noteTitle;
      funNote.textContent = uiText.result.noteDefault;
      document.getElementById('authorSummary').textContent = uiText.result.authorSummary;
      document.documentElement.style.setProperty('--author-summary-expand', `"${uiText.result.authorExpand}"`);
      document.documentElement.style.setProperty('--author-summary-collapse', `"${uiText.result.authorCollapse}"`);
      authorContent.innerHTML = uiText.result.authorParagraphs.map(text => `<p>${text}</p>`).join('');

      const detailUI = uiText.detail || {};
      const navTitle = isPlaceholder(detailUI.navTitle) ? '这人什么路数' : detailUI.navTitle;
      document.getElementById('detailNavTitle').textContent = navTitle;
      const navIntro = detailUI.navIntro || '先看概况';
      const navRomantic = detailUI.navRomantic || '谈恋爱时';
      const navFriends = detailUI.navFriendships || '当朋友时';
      document.querySelectorAll('[data-section="section-intro"]').forEach(a => a.textContent = navIntro);
      document.querySelectorAll('[data-section="section-romantic"]').forEach(a => a.textContent = navRomantic);
      document.querySelectorAll('[data-section="section-friends"]').forEach(a => a.textContent = navFriends);
    }

    function showScreen(name) {
      Object.entries(screens).forEach(([key, el]) => {
        el.classList.toggle('active', key === name);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getVisibleQuestions() {
      const visible = [...app.shuffledQuestions];
      const gateIndex = visible.findIndex(q => q.id === 'drink_gate_q1');
      if (gateIndex !== -1 && app.answers['drink_gate_q1'] === 3) {
        visible.splice(gateIndex + 1, 0, specialQuestions[1]);
      }
      return visible;
    }

    function getQuestionMetaLabel(q) {
      if (q.special) return uiText.question.specialMeta;
      return app.previewMode ? dimensionMeta[q.dim].name : uiText.question.hiddenMeta;
    }

    function bindBrowseClicks(container) {
      container.querySelectorAll('[data-browse-code]').forEach((card) => {
        card.onclick = () => openTypeDetail(card.dataset.browseCode);
      });
    }

    function renderBandType(code) {
      const type = TYPE_LIBRARY[code];
      const imgSrc = TYPE_IMAGES[code];
      const imgHtml = imgSrc
        ? `<img src="${imgSrc}" alt="${type.code}" onerror="this.style.display='none'" />`
        : '';
      return `
        <article class="band-type" data-browse-code="${type.code}">
          <div class="band-figure">${imgHtml}</div>
          <div class="band-name">${type.cn}</div>
          <div class="band-code">${type.code}</div>
          <div class="band-intro">${type.intro}</div>
        </article>
      `;
    }

    function renderEasterType(code) {
      const type = TYPE_LIBRARY[code];
      const imgSrc = TYPE_IMAGES[code];
      const imgHtml = imgSrc
        ? `<img src="${imgSrc}" alt="${type.code}" onerror="this.style.display='none'" />`
        : '';
      return `
        <article class="catalog-easter-card" data-browse-code="${type.code}">
          <div class="catalog-easter-figure">${imgHtml}</div>
          <div class="catalog-easter-copy">
            <span class="catalog-easter-code">${type.code}</span>
            <h4>${type.cn}</h4>
            <p>${type.intro}</p>
          </div>
        </article>
      `;
    }

    function renderBrowseCatalog() {
      browseMainGrid.innerHTML = BROWSE_GROUPS.map(group => `
        <section class="catalog-band catalog-band--${group.theme}">
          <div class="catalog-band-watermark">${group.watermark}</div>
          <div class="catalog-band-head">
            <div class="catalog-band-kicker">${group.kicker}</div>
            <h3>${group.title}</h3>
            <p>${group.desc}</p>
          </div>
          <div class="catalog-band-grid">
            ${group.codes.map(renderBandType).join('')}
          </div>
        </section>
      `).join('');

      browseEasterGrid.innerHTML = EASTER_EGG_TYPES.map(renderEasterType).join('');
      bindBrowseClicks(browseMainGrid);
      bindBrowseClicks(browseEasterGrid);
    }

    function renderQuestions() {
      const visibleQuestions = getVisibleQuestions();
      questionList.innerHTML = '';
      visibleQuestions.forEach((q, index) => {
        const card = document.createElement('article');
        card.className = 'question';
        card.innerHTML = `
          <div class="question-meta">
            <div class="badge">${formatText(uiText.question.numberTemplate, { index: index + 1 })}</div>
            <div>${getQuestionMetaLabel(q)}</div>
          </div>
          <div class="question-title">${q.text}</div>
          <div class="options">
            ${q.options.map((opt, i) => {
              const code = ['A', 'B', 'C', 'D'][i] || String(i + 1);
              const checked = app.answers[q.id] === opt.value ? 'checked' : '';
              return `
                <label class="option">
                  <input type="radio" name="${q.id}" value="${opt.value}" ${checked} />
                  <div class="option-code">${code}</div>
                  <div>${opt.label}</div>
                </label>
              `;
            }).join('')}
          </div>
        `;
        questionList.appendChild(card);
      });

      questionList.querySelectorAll('input[type="radio"]').forEach(input => {
        input.addEventListener('change', (e) => {
          const { name, value } = e.target;
          app.answers[name] = Number(value);

          if (name === 'drink_gate_q1') {
            if (Number(value) !== 3) {
              delete app.answers['drink_gate_q2'];
            }
            renderQuestions();
            return;
          }

          updateProgress();
        });
      });

      updateProgress();
    }

    function updateProgress() {
      const visibleQuestions = getVisibleQuestions();
      const total = visibleQuestions.length;
      const done = visibleQuestions.filter(q => app.answers[q.id] !== undefined).length;
      const percent = total ? (done / total) * 100 : 0;
      progressBar.style.width = `${percent}%`;
      progressText.textContent = formatText(uiText.templates.progress, { done, total });
      const complete = done === total && total > 0;
      submitBtn.disabled = !complete;
      testHint.textContent = complete
        ? uiText.progress.completeHint
        : uiText.progress.incompleteHint;
    }

    function sumToLevel(score) {
      if (score <= 3) return 'L';
      if (score === 4) return 'M';
      return 'H';
    }

    function levelNum(level) {
      return { L: 1, M: 2, H: 3 }[level];
    }

    function parsePattern(pattern) {
      return pattern.replace(/-/g, '').split('');
    }

    function getDrunkTriggered() {
      return app.answers[DRUNK_TRIGGER_QUESTION_ID] === 2;
    }

    function computeResult() {
      const rawScores = {};
      const levels = {};
      Object.keys(dimensionMeta).forEach(dim => { rawScores[dim] = 0; });

      questions.forEach(q => {
        rawScores[q.dim] += Number(app.answers[q.id] || 0);
      });

      Object.entries(rawScores).forEach(([dim, score]) => {
        levels[dim] = sumToLevel(score);
      });

      const userVector = dimensionOrder.map(dim => levelNum(levels[dim]));
      const ranked = NORMAL_TYPES.map(type => {
        const vector = parsePattern(type.pattern).map(levelNum);
        let distance = 0;
        let exact = 0;
        for (let i = 0; i < vector.length; i++) {
          const diff = Math.abs(userVector[i] - vector[i]);
          distance += diff;
          if (diff === 0) exact += 1;
        }
        const similarity = Math.max(0, Math.round((1 - distance / 30) * 100));
        return { ...type, ...TYPE_LIBRARY[type.code], distance, exact, similarity };
      }).sort((a, b) => {
        if (a.distance !== b.distance) return a.distance - b.distance;
        if (b.exact !== a.exact) return b.exact - a.exact;
        return b.similarity - a.similarity;
      });

      const bestNormal = ranked[0];
      const drunkTriggered = getDrunkTriggered();

      let finalType;
      let modeKicker = uiText.resultStates.normal.modeKicker;
      let badge = formatText(uiText.templates.badgeNormal, {
        similarity: bestNormal.similarity,
        exact: bestNormal.exact
      });
      let sub = uiText.resultStates.normal.sub;
      let special = false;
      let secondaryType = null;

      if (drunkTriggered) {
        finalType = TYPE_LIBRARY.DRUNK;
        secondaryType = bestNormal;
        modeKicker = uiText.resultStates.drunk.modeKicker;
        badge = uiText.resultStates.drunk.badge;
        sub = uiText.resultStates.drunk.sub;
        special = true;
      } else if (bestNormal.similarity < 60) {
        finalType = TYPE_LIBRARY.HHHH;
        modeKicker = uiText.resultStates.fallback.modeKicker;
        badge = formatText(uiText.templates.badgeFallback, { similarity: bestNormal.similarity });
        sub = uiText.resultStates.fallback.sub;
        special = true;
      } else {
        finalType = bestNormal;
      }

      return {
        rawScores,
        levels,
        ranked,
        bestNormal,
        finalType,
        modeKicker,
        badge,
        sub,
        special,
        secondaryType
      };
    }

    function renderDimList(result) {
      const dimList = document.getElementById('dimList');
      dimList.innerHTML = dimensionOrder.map(dim => {
        const level = result.levels[dim];
        const explanation = DIM_EXPLANATIONS[dim][level];
        return `
          <div class="dim-item">
            <div class="dim-item-top">
              <div class="dim-item-name">${dimensionMeta[dim].name}</div>
              <div class="dim-item-score">${formatText(uiText.templates.dimScore, { level, score: result.rawScores[dim] })}</div>
            </div>
            <p>${explanation}</p>
          </div>
        `;
      }).join('');
    }

    function setResultMode(mode) {
      app.resultViewMode = mode;
      restartBtn.textContent = mode === 'browse'
        ? uiText.buttons.start
        : uiText.buttons.restart;
      resultBrowseBtn.textContent = mode === 'browse'
        ? uiText.buttons.backBrowse
        : uiText.buttons.browseAll;
    }

    function isPlaceholder(text) {
      return !text || String(text).trim().startsWith('__GEMINI__');
    }

    function renderRelationSection(container, data, displayTitle) {
      const wrapper = container.parentElement;
      if (!data || !data.title || isPlaceholder(data.lead)) {
        wrapper.classList.add('is-hidden');
        container.innerHTML = '';
        return false;
      }
      wrapper.classList.remove('is-hidden');
      container.innerHTML = `
        <h2>${displayTitle || data.title}</h2>
        <p class="relation-lead">${data.lead}</p>
        ${data.callout && !isPlaceholder(data.callout) ? `<div class="relation-callout">${data.callout}</div>` : ''}
        ${(data.sections || []).filter(s => !isPlaceholder(s.body)).map(s => `
          <div class="relation-sub">
            <h3>${s.heading}</h3>
            <p>${s.body}</p>
          </div>
        `).join('')}
      `;
      return true;
    }

    function updateDetailNav(hasRomantic, hasFriends) {
      const sectionCount = 1 + (hasRomantic ? 1 : 0) + (hasFriends ? 1 : 0);
      document.getElementById('detailSidebar').classList.toggle('is-hidden', sectionCount <= 1);
      const pills = document.getElementById('detailPills');
      pills.classList.toggle('is-hidden', sectionCount <= 1);

      document.querySelectorAll('[data-section="section-romantic"]').forEach(el => {
        el.style.display = hasRomantic ? '' : 'none';
      });
      document.querySelectorAll('[data-section="section-friends"]').forEach(el => {
        el.style.display = hasFriends ? '' : 'none';
      });

      document.querySelectorAll('.detail-nav a, .detail-pills a').forEach(a => {
        a.classList.remove('active');
      });
      document.querySelectorAll('[data-section="section-intro"]').forEach(a => {
        a.classList.add('active');
      });
    }

    let detailObserver = null;
    function setupDetailNavObserver() {
      if (detailObserver) detailObserver.disconnect();

      const sectionIds = ['section-intro', 'section-romantic', 'section-friends'];
      const allNavLinks = document.querySelectorAll('.detail-nav a, .detail-pills a');

      detailObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            const targetId = entry.target.id;
            allNavLinks.forEach(link => {
              link.classList.toggle('active', link.dataset.section === targetId);
            });
            break;
          }
        }
      }, { rootMargin: '-10% 0px -70% 0px' });

      sectionIds.forEach(id => {
        const el = document.getElementById(id);
        if (el && !el.classList.contains('is-hidden')) {
          detailObserver.observe(el);
        }
      });

      allNavLinks.forEach(link => {
        link.onclick = (e) => {
          e.preventDefault();
          const targetId = link.dataset.section;
          const target = document.getElementById(targetId);
          if (target) target.scrollIntoView({ behavior: 'smooth' });
        };
      });
    }

    function renderTypeDetail({ type, modeKicker, badge, sub, note, showMatch, showDims, result, mode }) {
      setResultMode(mode);

      resultModeKicker.textContent = modeKicker;
      resultTypeName.textContent = formatText(uiText.templates.typeName, { code: type.code, cn: type.cn });
      matchBadge.textContent = badge || '';
      resultTypeSub.textContent = sub;
      resultDesc.textContent = type.desc;
      posterCaption.textContent = type.intro;
      funNote.textContent = note;
      matchBadge.classList.toggle('is-hidden', !showMatch);
      dimBox.classList.toggle('is-hidden', !showDims);

      const posterBox = document.getElementById('posterBox');
      const imageSrc = TYPE_IMAGES[type.code];
      if (imageSrc) {
        posterImage.src = imageSrc;
        posterImage.alt = formatText(uiText.templates.typeName, { code: type.code, cn: type.cn });
        posterBox.classList.remove('no-image');
      } else {
        posterImage.removeAttribute('src');
        posterImage.alt = uiText.result.posterAlt;
        posterBox.classList.add('no-image');
      }

      if (showDims && result) {
        renderDimList(result);
      } else {
        document.getElementById('dimList').innerHTML = '';
      }

      const detailUI = uiText.detail || {};
      const hasRomantic = renderRelationSection(
        document.getElementById('romanticSection'),
        type.romanticRelationships,
        detailUI.navRomantic || '谈恋爱时'
      );
      const hasFriends = renderRelationSection(
        document.getElementById('friendsSection'),
        type.friendships,
        detailUI.navFriendships || '当朋友时'
      );
      updateDetailNav(hasRomantic, hasFriends);

      showScreen('result');
      requestAnimationFrame(() => setupDetailNavObserver());
    }

    function renderResult(source = 'test') {
      const result = computeResult();
      const type = result.finalType;
      const isRandom = source === 'random';

      const modeKicker = isRandom
        ? formatText(uiText.resultStates.random.modeKickerTemplate, { mode: result.modeKicker })
        : result.modeKicker;
      const sub = isRandom
        ? formatText(uiText.resultStates.random.subTemplate, { base: result.sub })
        : result.sub;
      const note = isRandom
        ? uiText.notes.random
        : (result.special ? uiText.notes.special : uiText.notes.normal);

      renderTypeDetail({
        type,
        modeKicker,
        badge: result.badge,
        sub,
        note,
        showMatch: true,
        showDims: true,
        result,
        mode: isRandom ? 'random' : 'test'
      });
    }

    function openTypeDetail(code) {
      const type = TYPE_LIBRARY[code];
      if (!type) return;
      renderTypeDetail({
        type,
        modeKicker: uiText.browse.detailKicker,
        badge: '',
        sub: uiText.browse.detailSub,
        note: uiText.browse.detailNote,
        showMatch: false,
        showDims: false,
        result: null,
        mode: 'browse'
      });
    }

    function getRandomOptionValue(question) {
      const options = question.options || [];
      const picked = options[Math.floor(Math.random() * options.length)];
      return picked ? picked.value : undefined;
    }

    function generateRandomAnswers() {
      const answers = {};
      questions.forEach((question) => {
        answers[question.id] = getRandomOptionValue(question);
      });

      const gateQuestion = specialQuestions[0];
      answers[gateQuestion.id] = getRandomOptionValue(gateQuestion);

      if (answers[gateQuestion.id] === 3) {
        answers[specialQuestions[1].id] = getRandomOptionValue(specialQuestions[1]);
      }

      return answers;
    }

    function startRandomResult() {
      app.previewMode = false;
      app.shuffledQuestions = [];
      app.answers = generateRandomAnswers();
      renderResult('random');
    }

    function startTest(preview = false) {
      app.previewMode = preview;
      app.answers = {};
      const shuffledRegular = shuffle(questions);
      const insertIndex = Math.floor(Math.random() * shuffledRegular.length) + 1;
      app.shuffledQuestions = [
        ...shuffledRegular.slice(0, insertIndex),
        specialQuestions[0],
        ...shuffledRegular.slice(insertIndex)
      ];
      renderQuestions();
      showScreen('test');
    }

    applyStaticTexts();
    renderBrowseCatalog();
    document.getElementById('startBtn').addEventListener('click', () => startTest(false));
    document.getElementById('browseBtn').addEventListener('click', () => {
      renderBrowseCatalog();
      showScreen('browse');
    });
    document.getElementById('randomBtn').addEventListener('click', startRandomResult);
    document.getElementById('browseBackBtn').addEventListener('click', () => showScreen('intro'));
    document.getElementById('browseStartBtn').addEventListener('click', () => startTest(false));
    document.getElementById('backIntroBtn').addEventListener('click', () => showScreen('intro'));
    document.getElementById('submitBtn').addEventListener('click', () => renderResult('test'));
    document.getElementById('restartBtn').addEventListener('click', () => startTest(false));
    document.getElementById('resultBrowseBtn').addEventListener('click', () => {
      renderBrowseCatalog();
      showScreen('browse');
    });
    document.getElementById('toTopBtn').addEventListener('click', () => showScreen('intro'));
  </script>

</body>
